<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="border-top:1px solid #DED9CD">
  <button onClick="{{ toggle }}" aria-expanded="{{ open }}" style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:{{ pad }} 0;background:none;border:0;text-align:left;cursor:pointer;color:#0B0B0D;transition:padding .5s cubic-bezier(.2,.7,.2,1)">
    <h3 style="margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(21px,2.1vw,27px);line-height:1.3;letter-spacing:-.005em">{{ q }}</h3>
    <span aria-hidden="true" style="width:40px;height:40px;flex:0 0 auto;border-radius:50%;border:1px solid {{ signBorder }};background:{{ signBg }};color:{{ signFg }};display:flex;align-items:center;justify-content:center;font-family:Manrope,sans-serif;font-size:16px;transition:all .4s">{{ sign }}</span>
  </button>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="padding:0 56px 28px 0;max-width:720px">
      <p style="margin:0;font-family:Manrope,sans-serif;font-size:15px;line-height:1.75;color:#5E5B54">{{ a }}</p>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:140},&quot;q&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Question?&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;a&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Answer.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;defaultOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { open: false };
  componentDidMount() { if (this.props.defaultOpen) this.setState({ open: true }); }
  renderVals() {
    const open = this.state.open;
    return {
      q: this.props.q ?? '', a: this.props.a ?? '',
      pad: open ? '28px' : '24px',
      open, sign: open ? '−' : '+', toggle: () => this.setState({ open: !open }),
      signBorder: open ? '#19191C' : '#DED9CD', signBg: open ? '#19191C' : 'transparent', signFg: open ? '#D6A63A' : '#0B0B0D',
    };
  }
}
</script>
</body>
</html>
