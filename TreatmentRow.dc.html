<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="border-top:1px solid #DED9CD">
  <button onClick="{{ toggle }}" aria-expanded="{{ open }}" style="width:100%;display:grid;grid-template-columns:{{ cols }};align-items:center;gap:{{ gap }};padding:{{ pad }} 0;background:none;border:0;text-align:left;cursor:pointer;color:#0B0B0D;transition:padding .5s cubic-bezier(.2,.7,.2,1)">
    <span style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:{{ numSize }};color:#8B6B1F">{{ num }}</span>
    <h3 style="margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:{{ titleSize }};line-height:1.1;letter-spacing:-.005em">{{ title }}</h3>
    <span aria-hidden="true" style="width:{{ signSize }};height:{{ signSize }};flex:0 0 auto;border-radius:50%;border:1px solid {{ signBorder }};background:{{ signBg }};color:{{ signFg }};display:flex;align-items:center;justify-content:center;font-family:Manrope,sans-serif;font-size:16px;transition:all .4s">{{ sign }}</span>
  </button>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="padding:0 24px {{ panelPadB }} {{ panelPadL }};display:flex;flex-direction:column;align-items:flex-start;gap:16px;max-width:640px">
      <p style="margin:0;font-family:Manrope,sans-serif;font-size:15px;line-height:1.7;color:#5E5B54">{{ desc }}</p>
      <a href="{{ href }}" style="display:inline-flex;align-items:center;gap:10px;font-family:Manrope,sans-serif;font-size:14px;font-weight:600;padding-bottom:4px;border-bottom:1px solid #D6A63A;color:#0B0B0D" style-hover="color:#8B6B1F">{{ cta }} <span aria-hidden="true" style="color:#8B6B1F">→</span></a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:200},&quot;num&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Preventive Dentistry&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;desc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Routine care for maintaining healthy teeth and gums.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slug&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;preventive-dentistry&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Book this treatment&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dense&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;defaultOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { w: 1280, open: false };
  componentDidMount() {
    this.r = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.r); this.r();
    if (this.props.defaultOpen) this.setState({ open: true });
  }
  componentWillUnmount() { window.removeEventListener('resize', this.r); }
  renderVals() {
    const p = this.props, s = this.state, desktop = s.w >= 820, dense = p.dense ?? false, open = s.open;
    const slug = p.slug ?? 'preventive-dentistry';
    return {
      desktop,
      num: p.num ?? '01', title: p.title ?? 'Treatment', desc: p.desc ?? '',
      href: `Contact.dc.html?t=${slug}`,
      cta: p.cta ?? 'Book this treatment',
      cols: desktop ? '64px minmax(0,1fr) 42px' : '36px 1fr 36px',
      gap: desktop ? '32px' : '12px',
      numSize: desktop ? (dense ? '22px' : '24px') : '20px',
      titleSize: desktop ? (dense ? 'clamp(26px,2.3vw,34px)' : 'clamp(30px,2.9vw,44px)') : '28px',
      pad: open ? (dense ? '28px' : '34px') : (dense ? '22px' : '26px'),
      signSize: desktop ? '42px' : '36px',
      panelPadL: desktop ? '96px' : '48px', panelPadB: '28px',
      open, sign: open ? '−' : '+', toggle: () => this.setState({ open: !open }),
      signBorder: open ? '#19191C' : '#DED9CD', signBg: open ? '#19191C' : 'transparent', signFg: open ? '#D6A63A' : '#0B0B0D',
    };
  }
}
</script>
</body>
</html>
